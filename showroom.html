<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;background:#fafafb;color:#101114}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#fafafb;z-index:10}
.card{background:#fff;border:1px solid #dedee5;border-radius:16px;padding:34px 30px;max-width:400px;width:100%;text-align:center}
.wm{font-weight:700;font-size:30px;letter-spacing:-1px;margin-bottom:4px}.wm i{font-style:normal;color:#bf1d2f}
.sub{color:#686b82;font-size:14px;margin-bottom:24px}
input{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;border-radius:10px;border:1px solid #dedee5;outline:none;margin-bottom:12px;text-align:center}
input:focus{border-color:#bf1d2f;box-shadow:0 0 0 3px rgba(191,29,47,.12)}
button{width:100%;border:0;background:#bf1d2f;color:#fff;font-family:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:12px;cursor:pointer}
button:disabled{opacity:.6}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:#686b82;margin:14px 0 0;cursor:pointer;user-select:none}
.err{color:#b01a2b;font-size:13.5px;margin-top:12px;display:none}
.load{display:none;color:#686b82;font-size:14px;margin-top:16px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #dedee5;border-top-color:#bf1d2f;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fafafb}
</style></head>

const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function track(n,p){try{if(typeof gtag==="function"){gtag("event",n,p||{});}}catch(e){}}
async function deriveKey(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
function reveal(html){
  const frame=document.getElementById("frame");
  frame.onload=function(){document.getElementById("gate").style.display="none";frame.style.display="block";};
  frame.srcdoc=html;
}
async function tryKey(key,how){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
  reveal(new TextDecoder().decode(pt));
  track("catalogue_unlock",{page:"showroom",method:how||"password"});
}
async function unlock(){
  const pw=document.getElementById("pw").value;
  if(!pw)return;
  document.getElementById("err").style.display="none";
  document.getElementById("load").style.display="block";
  document.getElementById("go").disabled=true;
  try{
    const key=await deriveKey(pw);
    if(document.getElementById("rem").checked){try{const jwk=await crypto.subtle.exportKey("jwk",key);localStorage.setItem("mzk_key",JSON.stringify(jwk));}catch(e){}}
    await tryKey(key,"password");
  }catch(e){
    document.getElementById("err").style.display="block";
    document.getElementById("load").style.display="none";
    document.getElementById("go").disabled=false;
    track("catalogue_unlock_failed",{page:"showroom"});
  }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
document.getElementById("go").disabled=false;
(async()=>{
  try{
    const j=localStorage.getItem("mzk_key");
    if(!j)return;
    document.getElementById("pw").style.display="none";
    document.getElementById("go").style.display="none";
    document.querySelector(".rem").style.display="none";
    document.getElementById("load").style.display="block";
    const key=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["decrypt"]);
    await tryKey(key,"remembered");
  }catch(e){try{localStorage.removeItem("mzk_key")}catch(_){}
    document.getElementById("pw").style.display="";
    document.getElementById("go").style.display="";
    document.querySelector(".rem").style.display="";
    document.getElementById("load").style.display="none";}
})();
</script>

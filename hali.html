<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halı · Mozaik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F4F3;--surface:#FFFFFF;--ink:#111111;--muted:#77777A;--line:#E3E3E1;--mz-red:#BE202E;--body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--mz-red)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--mz-red);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;gap:20px;padding-block:18px}
.brand{display:flex;align-items:center;gap:16px}
.mz-logo{display:block;height:24px;width:auto;color:var(--ink)}
.brand small{font:500 .64rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-left:16px;border-left:1px solid var(--line)}
.sp{flex:1}
.search-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--ink);background:none;font:600 .7rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.search-btn svg{width:16px;height:16px}
.search-btn:hover{background:var(--ink);color:var(--bg)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{border:0;background:none;padding:8px 12px;font-size:.7rem;font-weight:600;letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sitetabs{display:flex;justify-content:center;gap:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sitetabs a{padding:12px 0;font:600 .72rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sitetabs a:hover{color:var(--ink)}
.sitetabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--mz-red)}
.searchrow{position:relative;margin-top:14px}
.searchrow input{width:100%;font:inherit;font-size:.92rem;padding:14px 40px 14px 30px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
.searchrow input:focus{outline:none;border-bottom-color:var(--mz-red)}
.searchrow svg{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}
.searchrow .qx{position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;font-size:1.1rem}
.intro{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:40px 28px}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.intro h1{margin:0;font:500 clamp(3.2rem,10vw,7.5rem)/.95 var(--display);letter-spacing:-.05em;text-wrap:balance}
.intro p{margin:6px 0 0;max-width:52ch;font-size:.88rem;color:var(--muted);text-wrap:pretty}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.cats button{border:1px solid transparent;background:none;padding:10px 14px;font:500 .72rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.cats button small{font-size:.62rem;margin-left:5px;color:var(--muted)}
.cats button[aria-current="true"]{border-color:var(--ink)}
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:22px 18px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:600 .7rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;height:36px;padding:0 34px 0 12px;max-width:62vw}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.count{margin-left:auto;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;padding-bottom:64px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);padding:14px 14px 18px;min-width:0}
.card:focus-visible{outline:2px solid var(--mz-red);outline-offset:2px}
.media{aspect-ratio:4/3;background:#fff;overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain;transition:transform .5s ease}
.card:hover .media img{transform:scale(1.03)}
.meta{margin-top:14px;display:grid;gap:3px}
.meta .br{font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meta h3{margin:0;font:500 .92rem/1.3 var(--body);letter-spacing:-.01em}
.meta .dm{font-size:.74rem;color:var(--muted)}
.qty{justify-self:start;margin-top:6px;font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink)}
.soon{justify-self:start;margin-top:6px;font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;background:var(--ink);color:var(--bg)}
.brands{display:flex;flex-direction:column;align-items:center;padding-top:22px}
.brands .brand-toggle{display:flex;align-items:baseline;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--ink);background:none;color:var(--ink);font:600 .7rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.brands .brand-toggle span{color:var(--muted)}
.brands .brand-toggle b{font-weight:600}
.brands .brand-toggle .chev{display:inline-block;width:6px;height:6px;margin-left:4px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-3px) rotate(45deg);transition:transform .2s ease}
.brands .brand-toggle[aria-expanded="true"] .chev{transform:translateY(0) rotate(-135deg)}
.brand-list{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding-top:14px;max-width:900px}
.brand-list button{display:flex;align-items:center;gap:4px;border:0;background:none;padding:6px 0;font:500 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand-list button small{font-size:.62rem;letter-spacing:0;vertical-align:super;color:var(--muted)}
.brand-list button:hover{color:var(--ink)}
.brand-list button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
@media (max-width:640px){
  .brands{align-items:stretch;padding-top:10px}
  .brands .brand-toggle{width:100%;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .brands .brand-toggle .chev{margin-left:auto}
  .brand-list{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;padding-top:4px;border-bottom:1px solid var(--line)}
  .brand-list button{justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:1.25fr 1fr;background:var(--surface)}
[hidden]{display:none!important}
.sheet .hero{position:relative;background:#fff;min-height:0}
.sheet .body{overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) clamp(20px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 40px);min-width:0}
.close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;z-index:3;border:1px solid var(--line);background:var(--surface);width:48px;height:48px;font-size:1.4rem;line-height:1}
.sheet .eyebrow{font-size:.66rem;letter-spacing:.2em}
.sheet h2{font:500 clamp(2.2rem,4.4vw,3.4rem)/1 var(--display);letter-spacing:-.04em;margin:8px 0 6px}
.sheet .by{color:var(--muted);margin:0 0 28px}
.spec{border-top:1px solid var(--line);padding-block:18px;display:grid;grid-template-columns:150px 1fr;gap:16px}
.spec h4{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.spec p{margin:0}
.spec ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.spec li{border:1px solid var(--line);padding:5px 12px;font-size:.88rem}
.spec ul.plain{display:grid;gap:4px}
.spec ul.plain li{border:0;padding:0;font-size:.95rem}
.spec ul.codes li{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.mats button{aspect-ratio:1;border:1px solid var(--line);background:#fff;padding:0;cursor:zoom-in}
.mats img{width:100%;height:100%;object-fit:contain}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;border:1px solid var(--ink);background:none;color:var(--ink);padding:14px 20px;font:600 .76rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--mz-red);border-color:var(--mz-red);color:#fff}
.gal{position:absolute;inset:0;display:flex;flex-direction:column;background:#FFFFFF}
.gal-main{position:relative;flex:1;min-height:0;cursor:zoom-in;touch-action:pan-y}
.gal-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;width:48px;height:48px;background:rgb(255 255 255 / .9);color:#1B1D1F;font-size:1.4rem;box-shadow:0 2px 10px rgb(0 0 0 / .15)}
.gal-nav.prev{left:16px}.gal-nav.next{right:16px}
.gal-zoom{position:absolute;right:16px;bottom:16px;z-index:2;border:0;padding:10px 16px;background:rgb(27 29 31 / .82);color:#FFFFFF;font-size:.82rem;font-weight:600;letter-spacing:.04em}
.thumbs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#F2F1EE;flex:none}
.thumbs button{flex:none;width:76px;height:54px;border:2px solid transparent;padding:0;background:#FFFFFF;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:#1B1D1F}
.thumbs img{width:100%;height:100%;object-fit:contain}
.lb{position:fixed;inset:0;z-index:40;background:#0E0F0F;color:#FFFFFF;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.lb-title{flex:1;min-width:0;font:500 1.3rem/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-count{font-size:.85rem;color:#B9BBB6;font-variant-numeric:tabular-nums}
.lb-btn{border:1px solid rgb(255 255 255 / .25);background:none;color:#FFFFFF;width:44px;height:44px;font-size:1.25rem;line-height:1}
.lb-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#FFFFFF;cursor:zoom-in;touch-action:pinch-zoom}
.lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .25s ease;transform-origin:center}
.lb-stage.z{cursor:zoom-out}
.lb-stage.z img{transform:scale(2.2)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;width:52px;height:52px;background:rgb(27 29 31 / .7);color:#FFFFFF;font-size:1.5rem}
.lb-nav.prev{left:16px}.lb-nav.next{right:16px}
footer{border-top:1px solid var(--line);padding-block:28px;font-size:.74rem;color:var(--muted)}
footer .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
@media (max-width:820px){
  .sheet{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
  .gal-nav{width:40px;height:40px}
  .spec{grid-template-columns:1fr;gap:6px}
}
@media (max-width:640px){
  .bar{padding-block:12px;gap:10px}
  .mz-logo{height:20px}
  .brand small{display:none}
  .search-btn{padding:0 10px;height:34px}
  .search-btn span{display:none}
  .sitetabs{gap:22px}
  .searchrow input{font-size:16px;padding-block:12px}
  .intro{justify-items:start;text-align:left;padding-block:22px 14px}
  .intro h1{font-size:clamp(2.2rem,11vw,3rem)}
  .intro p{display:none}
  .cats{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex:none;white-space:nowrap;padding:10px}
  .tools{padding-block:14px 12px;gap:8px}
  .sel select{font-size:16px;letter-spacing:0;text-transform:none;font-weight:500;height:34px}
  .count{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .card{padding:8px 8px 12px}
  .meta{margin-top:8px}
  .meta h3{font-size:.8rem}
  .meta .dm{font-size:.68rem}
}
</style>
<style id="mz-mobile-cats">
@media (max-width:640px){
  .cats,.filters{flex-wrap:wrap!important;overflow:visible!important;justify-content:flex-start!important;margin-inline:0!important;padding-inline:0!important;gap:6px!important}
  .cats{padding-top:10px!important}
  .cats button{flex:0 0 auto!important;white-space:nowrap;padding:9px 11px!important;font-size:.66rem!important;letter-spacing:.08em!important;border:1px solid var(--line)!important;margin:0!important}
  .cats button[aria-current="true"]{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
  .cats button[aria-current="true"] small{color:var(--bg)!important;opacity:.7}
  .filters .chip{flex:0 0 auto}
}
</style>

$("lb-close").onclick = () => { $("lb").hidden = true; };
$("lb-prev").onclick = e => { e.stopPropagation(); lbStep(-1); };
$("lb-next").onclick = e => { e.stopPropagation(); lbStep(1); };
$("lb-stage").onclick = e => { const st = $("lb-stage"), im = $("lb-img"); if (!st.classList.contains("z")){ const r = st.getBoundingClientRect(); im.style.transformOrigin = `${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; } st.classList.toggle("z"); };
$("d-close").onclick = closeItem;
$("d-next").onclick = () => openItem(cur + 1);
document.addEventListener("keydown", e => { if (!$("lb").hidden){ if (e.key === "Escape") $("lb").hidden = true; if (e.key === "ArrowLeft") lbStep(-1); if (e.key === "ArrowRight") lbStep(1); return; } if ($("sheet").hidden) return; if (e.key === "Escape") closeItem(); if (pics.length > 1 && e.key === "ArrowLeft") step(-1); if (pics.length > 1 && e.key === "ArrowRight") step(1); });
$("stsel").onchange = e => { status = e.target.value; renderGrid(); };
let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { const v = e.target.value.trim(); query = v.length >= 2 ? v : ""; $("qx").hidden = !e.target.value; render(); }, 150); });
$("qx").onclick = () => { $("q").value = ""; query = ""; $("qx").hidden = true; render(); $("q").focus(); };
$("search-btn").onclick = () => { window.scrollTo({top:0, behavior:"smooth"}); $("q").focus(); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("mz-lang", lang); } catch(e){} render(); });
(function init(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (CATS.includes(h)) cat = h;
  const item = DATA.find(p => p.i === h);
  if (item) cat = item.c;
  render();
  if (item) openItem(list.indexOf(item));
})();
</script>
</body>
</html>
